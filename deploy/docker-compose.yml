# 서버 한 대(VM)에 HTTPS까지 한 번에 띄우는 설정. 웹 화면·MCP가 https://<도메인> 하나로 열립니다.
#   1) 도메인의 DNS(A 레코드)를 이 서버 IP로 돌리고, 방화벽에서 80·443 포트를 엽니다.
#   2) cp .env.example .env  → 값 채우기
#   3) docker compose up -d --build
# Caddy가 인증서(Let's Encrypt)를 자동으로 받습니다. 앱 포트(8000)는 밖에 열리지 않고 Caddy만 앱에 닿습니다.
# 시연이 끝나면: docker compose down   (데이터까지 지우려면 docker compose down -v)
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      APPROVAL_BASE_URL: https://${APPROVAL_DOMAIN:?deploy/.env에 APPROVAL_DOMAIN을 넣으세요}
      APPROVAL_MCP_SECRET: ${APPROVAL_MCP_SECRET:?deploy/.env에 APPROVAL_MCP_SECRET을 넣으세요}
      APPROVAL_ADMIN_KEY: ${APPROVAL_ADMIN_KEY:?deploy/.env에 APPROVAL_ADMIN_KEY를 넣으세요}
      APPROVAL_SITE_KEY: ${APPROVAL_SITE_KEY:-}
    volumes:
      - approval-data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APPROVAL_DOMAIN: ${APPROVAL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  approval-data:
  caddy-data:
  caddy-config:
