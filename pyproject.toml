[project]
name = "approval-demo"
version = "0.1.0"
description = "목업 전결 시스템 + MCP 연동 시연용 프로그램 (P1 전결 코어, P2 MCP 서버, P3 웹 화면, P4 생성기)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp[cli]>=2.3.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
approval-seed = "seedgen.cli:main"
approval-server = "core.cli:main"
approval-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "web", "mcp_server", "seedgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
